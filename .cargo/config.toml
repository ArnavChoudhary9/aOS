[alias]
xtask = "run --quiet -p xtask --"

# Applies to the kernel and (later) every Rust userspace binary.
[target.x86_64-unknown-none]
rustflags = [
    # Frame pointers on everywhere: backtraces and crash reports walk RBP.
    "-C", "force-frame-pointers=yes",
    # Static-PIE output, so Limine can slide the kernel (KASLR) and the
    # loader can randomize user programs (ASLR).
    "-C", "relocation-model=pie",
]
