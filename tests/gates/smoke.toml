# Phase 0.1–0.3 smoke test: the kernel boots under Limine with KASLR, logs
# to COM2 in the standard format, and reports success to the harness.
name = "smoke"
timeout = "20s"

[[expect]]
re = '^\[ *\d+\] INFO  kernel: aOS kernel \d+\.\d+\.\d+ base=0xffffffff[0-9a-f]{8} phys=0x[0-9a-f]+$'

[[expect]]
re = '^\[ *\d+\] INFO  kernel: slide=0x[0-9a-f]+$'

[[expect]]
re = 'INFO  kernel: limine: rev=3 .*cmdline="gate"$'

[[expect]]
re = 'INFO  kernel: gate: boot finished$'
