[package]
name = "xtask"
description = "Build, image, run and test tooling for aOS (cargo xtask ...)"
version.workspace = true
edition.workspace = true
publish = false

# Kept small on purpose: xtask shells out to standard host tools
# (curl, tar, sha256sum, make, xorriso, qemu-system-x86_64) and only uses
# crates for parsing gate specs. Versions are pinned exactly.
[dependencies]
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=0.9.8"
